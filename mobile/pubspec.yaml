name: doctor_appointment
description: Online Doctor Appointment Booking Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.1.2
  timeago: ^3.7.0
  flutter_screenutil: ^5.9.3
  uuid: ^4.4.0
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
